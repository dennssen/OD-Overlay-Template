<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-container">
        <div id="top-bar">
            <div id="team1-players">
                <div class="player-name">
                    <p>Dennssen</p>
                </div>
                <div class="player-name">
                    <p>Thomazzz</p>
                </div>
                <div class="player-name">
                    <p>Deppp</p>
                </div>
            </div>
            <div id="game-bar">
                <div class="team-info">
                    <img src="Assets/Images/Devious_LOGO.png" alt="">
                    <div class="team-logo">
                    </div>
                    <p style="text-align: left;">Devious</p>
                </div>
                <div id="game-info">
                    <div id="game-time">
                        05:00
                    </div>
                    <div id="game-score">
                        <div class="team-score">
                            2
                        </div>
                        <div id="score-seperator">
                            -
                        </div>
                        <div class="team-score">
                            4
                        </div>
                    </div>
                </div>
                <div class="team-info">
                    <p style="text-align: right;">COLD</p>
                    <img src="Assets/Images/coldNEW.png" alt="">
                </div>
            </div>
            <div id="team2-players">
                <div class="player-name">
                    <p>Pugg</p>
                </div>
                <div class="player-name">
                    <p>MrVenom</p>
                </div>
                <div class="player-name">
                    <p>AsGeorgie</p>
                </div>
            </div>
        </div>
        <div class="team1-stats-box">
            <div class="stats-header">Following:</div>
            <div class="follow-player-name">Thomazzz</div>
            <div class="divider"></div>
            <div class="stats">
                <p>Saves: 0</p>
                <div class="stats-divider"></div>
                <p>Goals: 2</p>
                <div class="stats-divider"></div>
                <p>Assists: 0</p>
                <div class="stats-divider"></div>
                <p>Possession: 68</p>
            </div>
        </div>
        <div class="team2-stats-box">
            <div class="stats-header">Following:</div>
            <div class="follow-player-name">AsGeorgie</div>
            <div class="divider"></div>
            <div class="stats">
                <p>Saves: 0</p>
                <div class="stats-divider"></div>
                <p>Goals: 3</p>
                <div class="stats-divider"></div>
                <p>Assists: 1</p>
                <div class="stats-divider"></div>
                <p>Possession: 112</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
