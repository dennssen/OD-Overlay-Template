<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-container">
        <div id="top-bar">
            <div id="home-players">
                <div class="player-name">
                    <p>Dennssen</p>
                </div>
                <div class="player-name">
                    <p>Thomazzz</p>
                </div>
                <div class="player-name">
                    <p>Deppp</p>
                </div>
            </div>
            <div id="game-bar">
                <div class="team-info">
                    <img src="Assets/Images/Devious_LOGO.png" alt="">
                    <p style="text-align: left;">Devious</p>
                </div>
                <div id="game-info-container">
                    <div id="game-info">
                        <div id="tourny-info">
                            <p>ODC First Masters Tournament</p>
                        </div>
                        <div id="game-score">
                            <div id="home-score">
                                2
                            </div>
                            <div id="away-score">
                                4
                            </div>
                        </div>
                        <div id="game-time">
                            05:00
                        </div>
                    </div>
                </div>
                <div class="team-info">
                    <p style="text-align: right;">COLD</p>
                    <img src="Assets/Images/coldNEW.png" alt="">
                </div>
            </div>
            <div id="away-players">
                <div class="player-name">
                    <p>Pugg</p>
                </div>
                <div class="player-name">
                    <p>MrVenom</p>
                </div>
                <div class="player-name">
                    <p>AsGeorgie</p>
                </div>
            </div>
        </div>
        <div id="home-stats-box">
            <div id="home-follow-player-name">Thomazzz</div>
            <div class="stats">
                <p id="home-goals">Goals: 2</p>
                <div class="stats-divider"></div>
                <p id="home-assists">Assists: 0</p>
                <div class="stats-divider"></div>
                <p id="home-saves">Saves: 0</p>
            </div>
        </div>
        <div id="away-stats-box">
            <div id="away-follow-player-name">AsGeorgie</div>
            <div class="stats" style="margin-left: 20px;">
                <p id="away-goals">Goals: 3</p>
                <div class="stats-divider"></div>
                <p id="away-assists">Assists: 1</p>
                <div class="stats-divider"></div>
                <p id="away-saves">Saves: 0</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
