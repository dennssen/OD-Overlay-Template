<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gameinfo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <title>Gameinfo</title>
</head>

<body>
    <div class="top">
        <div id="home-players" class="players-container">
        </div>
        <div class="scoreboard-area">

        </div>
        <div id="away-players" class="players-container">
        </div>

        <div id="goalboard" class="middle animate__animated animate__fadeOutDownBig">
            <svg width="702" height="98" viewBox="0 0 702 98" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1H701L645.574 97H56.4256L1 1Z" fill="url(#paint0_linear_42_3)" stroke="black" />
                <defs>
                    <linearGradient id="paint0_linear_42_3" x1="351" y1="-49.5" x2="351" y2="470"
                        gradientUnits="userSpaceOnUse">
                        <stop id="goalboard-color" stop-color="var(--homeColor)" />
                        <stop offset="1" stop-color="#737373" stop-opacity="0" />
                    </linearGradient>
                </defs>
                <text id="goalboard-shooter" class="fit" data-max-width="280" data-max-font-size="60" x="50%"
                    y="38%"></text>
                <text id="goalboard-assister" class="fit" data-max-width="250" data-max-font-size="25" x="50%"
                    y="84%"></text>
                <text id="goalboard-shot-speed" style="text-anchor: end;" x="31.5%" y="50%" font-size="36">0m/s</text>
                <text x="22%" y="75%" font-size="24">Shot Speed</text>
                <text id="goalboard-shot-distance" style="text-anchor: start;" x="68.5%" y="50%"
                    font-size="36">0m</text>
                <text x="80%" y="75%" font-size="24">Shot Distance</text>
            </svg>
        </div>

        <div class="bottom-left animate__animated animate__fadeOutDown">
            <svg viewBox="0 0 204 339" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect class="player-stats-home-color" x="2" y="2" width="200" height="60" rx="10" stroke="black"
                    stroke-width="3" />
                <rect x="2" y="87" width="200" height="250" rx="10" fill="url(#paint0_linear_34_4)" stroke="black"
                    stroke-width="3" />
                <path d="M3.5 149.5H200.5" stroke="black" stroke-width="3" />
                <path d="M2 212H202" stroke="black" stroke-width="3" />
                <path d="M2 274H202" stroke="black" stroke-width="3" />
                <defs>
                    <linearGradient id="paint0_linear_34_4" x1="202" y1="87" x2="-6.99998" y2="541.5"
                        gradientUnits="userSpaceOnUse">
                        <stop class="player-stats-home-gradient" />
                        <stop offset="1" stop-color="#070707" />
                    </linearGradient>
                </defs>
                <text id="home-stats-name" class="fit" data-padding="20" data-max-font-size="40" x="50%" y="10%"></text>

                <text id="home-stats-goals" x="50%" y="36%" font-size="35">Goals: 0</text>
                <text id="home-stats-assists" x="50%" y="54%" font-size="35">Assists: 0</text>
                <text id="home-stats-saves" x="50%" y="72%" font-size="35">Saves: 0</text>
            </svg>
        </div>

        <div class="bottom-right animate__animated animate__fadeOutDown">
            <svg viewBox="0 0 204 339" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect class="player-stats-away-color" x="2" y="2" width="200" height="60" rx="10" stroke="black"
                    stroke-width="3" />
                <rect x="2" y="87" width="200" height="250" rx="10" fill="url(#paint1_linear_34_4)" stroke="black"
                    stroke-width="3" />
                <path d="M3.5 149.5H200.5" stroke="black" stroke-width="3" />
                <path d="M2 212H202" stroke="black" stroke-width="3" />
                <path d="M2 274H202" stroke="black" stroke-width="3" />
                <defs>
                    <linearGradient id="paint1_linear_34_4" x1="202" y1="87" x2="-6.99998" y2="541.5"
                        gradientUnits="userSpaceOnUse">
                        <stop class="player-stats-away-gradient" />
                        <stop offset="1" stop-color="#070707" />
                    </linearGradient>
                </defs>
                <text id="away-stats-name" class="fit" data-padding="20" data-max-font-size="40" x="50%" y="10%"></text>

                <text id="away-stats-goals" x="50%" y="36%" font-size="35">Goals: 0</text>
                <text id="away-stats-assists" x="50%" y="54%" font-size="35">Assists: 0</text>
                <text id="away-stats-saves" x="50%" y="72%" font-size="35">Saves: 0</text>
            </svg>
        </div>

        <script src="gameinfo.js"></script>
</body>

</html>
